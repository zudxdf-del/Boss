<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>BOSS</title>
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
  <main id="game-root">
    <canvas id="game" aria-label="Boss arena"></canvas>
    <div id="hud"></div>
    <div id="mobile-controls" aria-hidden="true">
      <div class="pad">
        <button data-key="up">▲</button>
        <div><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div>
      </div>
      <button id="fire-button">FIRE</button>
    </div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
