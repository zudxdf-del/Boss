<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Boss — Circular Co-op</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#eef6ff;font-family:system-ui,sans-serif;touch-action:none}button,input{font:inherit}button{min-height:46px;border:1px solid #33446e;border-radius:12px;padding:9px 14px;background:#18254a;color:#fff;font-weight:800}button:active{transform:scale(.97)}button.primary{background:#7045d8;border-color:#a78bfa}button:disabled{opacity:.4}input{min-height:46px;border-radius:12px;border:1px solid #334269;background:#080e20;color:#fff;padding:9px 12px;width:100%;font-size:16px}#app{height:100dvh;display:flex;flex-direction:column}header{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#070b18;border-bottom:1px solid #1c2745;z-index:20}.ok{color:#4ade80}.bad{color:#fb7185}.title{font-size:15px}.hidden{display:none!important}#menu{position:absolute;z-index:30;inset:54px 0 0;display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(circle at 50% 25%,#182553,#02040a 72%)}.panel{width:min(460px,94vw);max-height:94%;overflow:auto;padding:21px;border:1px solid #2c3a62;border-radius:20px;background:#080e20ee}.panel h1{margin:0 0 7px}.panel p{color:#aab7d7}.row{display:flex;gap:8px;margin:9px 0}.row>*{flex:1;min-width:0}.hint,.small{font-size:13px;color:#96a5c8}.room{margin-top:14px;padding:14px;border:1px solid #30416d;border-radius:14px;background:#050a18}.lobbyTitle{display:flex;justify-content:space-between}.code{font-size:30px;font-weight:950;letter-spacing:7px;text-align:center;margin:5px 0 10px}.players{display:grid;gap:7px;margin-top:8px}.player{display:flex;justify-content:space-between;padding:9px 11px;border-radius:9px;background:#101a34}.host{color:#fbbf24;font-weight:900}.start{width:100%;margin-top:12px}#game{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle,#10182f,#02040a 75%)}#arena{position:relative;width:min(100vw,calc(100dvh - 64px));height:min(100vw,calc(100dvh - 64px));max-width:1000px;max-height:1000px;aspect-ratio:1}.frame{position:absolute;inset:1%;border-radius:50%;overflow:hidden;border:3px solid #344776;box-shadow:0 0 0 10px #071024,0 0 55px #293b7a66,inset 0 0 80px #16234f}canvas{width:100%;height:100%;display:block}.hud{position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;pointer-events:none}.badge{background:#050a17dd;border:1px solid #33446b;border-radius:10px;padding:6px 9px;font-size:12px;font-weight:850}.bar{position:absolute;z-index:6;top:46px;left:12%;right:12%;height:16px;border:2px solid #52618a;border-radius:99px;background:#080c18;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ef3340,#f97316);transition:width .12s}.barText{position:absolute;z-index:7;top:47px;left:0;right:0;text-align:center;font-size:11px;font-weight:900;text-shadow:0 2px 4px #000}.touch{position:absolute;z-index:8;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.stick{width:118px;height:118px;border-radius:50%;background:#101a38aa;border:2px solid #41537e;pointer-events:auto;position:relative}.knob{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:#8bb7ffcc}.fire{width:94px;height:94px;border-radius:50%;background:#b52f58dd;border:2px solid #ff9ab2;pointer-events:auto}.end{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#02040ab8}.endBox{width:min(350px,88%);padding:22px;text-align:center;border:1px solid #344776;border-radius:18px;background:#080e20ee}.endBox button{width:100%}@media(max-height:520px) and (orientation:landscape){header{height:42px}.arena{width:min(100vw,calc(100dvh - 46px));height:min(100vw,calc(100dvh - 46px))}.touch{bottom:3px}.stick{width:82px;height:82px}.knob{width:36px;height:36px;left:21px;top:21px}.fire{width:68px;height:68px}.bar{top:38px}.barText{top:39px}}
</style>
</head>
<body>
<div id="app"><header><strong class="title">BOSS • CIRCULAR CO-OP ×4</strong><span id="status" class="bad">Отключено</span></header>
<section id="menu"><div class="panel"><h1>NEBULA RAID</h1><p>Круглая арена. До 4 пилотов. Игра начинается только после команды хоста.</p><input id="name" maxlength="16" placeholder="Имя пилота"><div class="row"><button id="create" class="primary">Создать комнату</button></div><div class="row"><input id="code" maxlength="6" placeholder="Код комнаты"><button id="join">Войти</button></div><div id="message" class="hint">Создай комнату или введи код друга.</div><div id="room" class="room hidden"><div class="lobbyTitle"><strong>ЛОББИ</strong><span id="count">0/4</span></div><div class="small">КОД КОМНАТЫ</div><div id="roomCodeBig" class="code">------</div><button id="copy" style="width:100%">Скопировать код</button><h3>Игроки</h3><div id="playerList" class="players"></div><button id="start" class="start primary hidden">НАЧАТЬ ИГРУ</button></div></div></section>
<main id="game" class="hidden"><div id="arena"><div class="frame"><canvas id="canvas"></canvas></div><div class="hud"><span class="badge" id="players">Игроки: 0/4</span><span class="badge" id="score">Счёт: 0</span><span class="badge" id="roomCode">Комната ------</span></div><div class="bar"><i id="bossBar"></i></div><div class="barText" id="bossText">БОСС 500 / 500</div><div class="touch"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><button class="fire" id="fire">ОГОНЬ</button></div><div id="end" class="end hidden"><div class="endBox"><h2 id="endTitle">БОЙ ОКОНЧЕН</h2><button id="restart" class="primary">ИГРАТЬ СНОВА</button></div></div><canvas id="drawCanvas" class="hidden"></canvas></div></main></div>
<script>
const $=s=>document.querySelector(s),menu=$('#menu'),game=$('#game'),canvas=$('#canvas'),ctx=canvas.getContext('2d'),statusEl=$('#status'),message=$('#message'),room=$('#room'),roomCodeBig=$('#roomCodeBig'),roomCodeHud=$('#roomCode'),playerList=$('#playerList'),countEl=$('#count'),startBtn=$('#start'),playersEl=$('#players'),scoreEl=$('#score'),bossBar=$('#bossBar'),bossText=$('#bossText'),end=$('#end'),endTitle=$('#endTitle');
let ws=null,me=null,hostId=null,pending=null,world={width:1000,height:1000},state={phase:'waiting',players:[],bullets:[],boss:{x:500,y:300,hp:500,maxHp:500,modules:[]}},input={x:0,y:0};
function setStatus(t,g){statusEl.textContent=t;statusEl.className=g?'ok':'bad'}function send(d){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(d))}
function connect(action){pending=action;if(ws&&(ws.readyState===WebSocket.OPEN||ws.readyState===WebSocket.CONNECTING)){if(ws.readyState===WebSocket.OPEN){send(pending);pending=null}return}setStatus('Подключение…',false);ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>{setStatus('Подключено',true);if(pending){send(pending);pending=null}};ws.onerror=()=>{setStatus('Ошибка соединения',false);message.textContent='Не удалось подключиться к серверу.'};ws.onclose=()=>setStatus('Отключено',false);ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='hello')world=m.world||world;if(m.type==='joined'){me=m.playerId;hostId=m.hostId;showLobby(m.code,m.players||[])}if(m.type==='room'){hostId=m.hostId;roomCodeBig.textContent=m.code;roomCodeHud.textContent='Комната '+m.code;countEl.textContent=m.count+'/'+m.max;renderPlayers(m.players||[]);if(m.phase==='waiting')showLobby(m.code,m.players||[]);if(m.phase==='playing')showGame()}if(m.type==='state'){state=m;renderPlayers(m.players||[]);playersEl.textContent='Игроки: '+m.players.length+'/4';const mep=m.players.find(p=>p.id===me);scoreEl.textContent='Счёт: '+(mep?.score||0);const hp=Math.max(0,m.boss.hp),max=m.boss.maxHp||500;bossBar.style.width=(hp/max*100)+'%';bossText.textContent='БОСС '+hp+' / '+max;if(m.phase==='playing')showGame();if(m.phase==='won'||m.phase==='lost'){end.classList.remove('hidden');endTitle.textContent=m.phase==='won'?'БОСС УНИЧТОЖЕН!':'КОМАНДА ПАЛА'}}if(m.type==='error')message.textContent=m.message}}
function showLobby(code,list){menu.classList.remove('hidden');game.classList.add('hidden');room.classList.remove('hidden');roomCodeBig.textContent=code;renderPlayers(list);startBtn.classList.toggle('hidden',me!==hostId);message.textContent=me===hostId?'Вы — ХОСТ. Нажмите «НАЧАТЬ ИГРУ», когда игроки готовы.':'Ожидание хоста…'}
function showGame(){menu.classList.add('hidden');game.classList.remove('hidden');end.classList.add('hidden');resize()}
function renderPlayers(list){countEl.textContent=list.length+'/4';playerList.innerHTML='';if(!list.length){playerList.innerHTML='<div class="hint">Ожидание игроков…</div>';return}list.forEach((p,i)=>{const d=document.createElement('div');d.className='player';const a=document.createElement('span');a.textContent=p.name;const b=document.createElement('span');b.className=p.host?'host':'';b.textContent=p.host?'★ ХОСТ':p.id===me?'ВЫ':'ПИЛОТ '+(i+1);d.append(a,b);playerList.appendChild(d)})}
$('#create').onclick=()=>connect({type:'create',name:$('#name').value.trim()||'Pilot'});$('#join').onclick=()=>{const c=$('#code').value.trim().toUpperCase();if(c.length!==6){message.textContent='Код должен содержать 6 символов.';return}connect({type:'join',code:c,name:$('#name').value.trim()||'Pilot'})};startBtn.onclick=()=>{if(me===hostId)send({type:'start'})};$('#restart').onclick=()=>{if(me===hostId)send({type:'restart'})};$('#copy').onclick=()=>{const c=roomCodeBig.textContent;const t=document.createElement('textarea');t.value=c;document.body.appendChild(t);t.select();try{document.execCommand('copy');message.textContent='Код скопирован.'}catch{message.textContent='Код: '+c}t.remove()};
setInterval(()=>send({type:'input',x:input.x,y:input.y}),33);$('#fire').addEventListener('pointerdown',e=>{e.preventDefault();send({type:'fire'})});
let active=false;const stick=$('#stick'),knob=$('#knob');function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),max=r.width*.34;if(l>max){dx=dx/l*max;dy=dy/l*max}input.x=dx/max;input.y=dy/max;knob.style.transform='translate('+dx+'px,'+dy+'px)'}stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(active)moveStick(e)});['pointerup','pointercancel'].forEach(t=>stick.addEventListener(t,()=>{active=false;input.x=input.y=0;knob.style.transform='translate(0,0)'}));
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')send({type:'fire'})});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);setInterval(()=>{if(document.activeElement&&document.activeElement.tagName==='INPUT')return;let x=(keys.d?1:0)-(keys.a?1:0),y=(keys.s?1:0)-(keys.w?1:0);if(x||y){const l=Math.hypot(x,y);input.x=x/l;input.y=y/l}else if(!active){input.x=input.y=0}},33);
function resize(){const s=Math.max(1,Math.floor(Math.min(canvas.clientWidth,canvas.clientHeight)*devicePixelRatio));canvas.width=s;canvas.height=s}addEventListener('resize',resize);resize();
function draw(){const scale=canvas.width/world.width;ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,world.width,world.height);ctx.fillStyle='#02040b';ctx.fillRect(0,0,1000,1000);ctx.save();ctx.beginPath();ctx.arc(500,500,430,0,Math.PI*2);ctx.clip();const g=ctx.createRadialGradient(500,500,30,500,500,430);g.addColorStop(0,'#151f42');g.addColorStop(1,'#040714');ctx.fillStyle=g;ctx.fillRect(70,70,860,860);for(let i=0;i<100;i++){ctx.fillStyle=i%4?'#ffffff33':'#8bb7ff55';ctx.fillRect((i*97)%860+70,(i*53)%860+70,2,2)}ctx.strokeStyle='#263a6b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(500,500,300,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(500,500,185,0,Math.PI*2);ctx.stroke();ctx.restore();const b=state.boss,t=performance.now();ctx.save();ctx.translate(b.x,b.y);ctx.rotate(t/1800);ctx.fillStyle='#17162e';ctx.strokeStyle='#c084fc';ctx.lineWidth=8;ctx.beginPath();for(let i=0;i<12;i++){const a=i*Math.PI/6,r=i%2?112:88;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.save();ctx.translate(Math.cos(a)*70,Math.sin(a)*70);ctx.rotate(a);ctx.fillStyle='#f59e0b';ctx.fillRect(-16,-16,32,32);ctx.strokeStyle='#ffe08a';ctx.strokeRect(-16,-16,32,32);ctx.restore()}ctx.fillStyle='#ef3340';ctx.beginPath();ctx.arc(0,0,32,0,Math.PI*2);ctx.fill();ctx.restore();for(const q of state.bullets){ctx.fillStyle=q.enemy?'#ff4d73':'#7de3ff';ctx.beginPath();ctx.arc(q.x,q.y,q.enemy?8:6,0,Math.PI*2);ctx.fill()}for(const p of state.players){if(p.hp<=0)continue;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(500-p.y,500-p.x)+Math.PI/2);ctx.fillStyle=p.color;ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(17,19);ctx.lineTo(0,11);ctx.lineTo(-17,19);ctx.closePath();ctx.fill();ctx.restore();ctx.fillStyle='#fff';ctx.font='15px system-ui';ctx.textAlign='center';ctx.fillText(p.name,p.x,p.y-29);ctx.fillStyle='#161a25';ctx.fillRect(p.x-22,p.y+25,44,5);ctx.fillStyle='#4ade80';ctx.fillRect(p.x-22,p.y+25,44*Math.max(0,p.hp)/100,5)}requestAnimationFrame(draw)}draw();
</script></body></html>
