<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Boss — 4 Player Co-op</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#03050d;color:#eef6ff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}button,input{font:inherit}button{min-height:44px;border:1px solid #35446d;border-radius:10px;padding:8px 14px;background:#172342;color:#fff;font-weight:800}button:active{transform:scale(.97)}button.primary{background:#6842c8;border-color:#9b75ff}button:disabled{opacity:.4}input{min-height:44px;border-radius:10px;border:1px solid #334269;background:#080e20;color:#fff;padding:8px 12px;width:100%}#app{height:100dvh;display:flex;flex-direction:column}header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:7px 14px;background:#070b18;border-bottom:1px solid #1e2947}.ok{color:#4ade80}.bad{color:#fb7185}.hidden{display:none!important}#menu{position:absolute;z-index:5;inset:56px 0 0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#182650,#03050d 68%)}.panel{width:min(470px,94vw);max-height:92vh;overflow:auto;padding:22px;border:1px solid #29365d;border-radius:18px;background:#090f21ee;box-shadow:0 25px 80px #000b}.panel h1{margin:0 0 6px}.panel p{color:#aab7d7}.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.hint{font-size:13px;color:#9ba9ca}.room{margin-top:14px;padding:14px;border:1px solid #303e68;border-radius:12px;background:#060a16}.code{font-size:30px;font-weight:950;letter-spacing:7px;text-align:center;margin:5px 0 10px}.players{display:grid;gap:7px}.player{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;background:#111a35}.host{color:#ffd166;font-weight:900}.empty{color:#7180a3}.copy{width:100%}.lobbyTitle{display:flex;justify-content:space-between;align-items:center}.start{width:100%;margin-top:12px}#game{position:relative;flex:1;min-height:0;background:#02040b}canvas{width:100%;height:100%;display:block}#hud{position:absolute;z-index:2;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-weight:800}.badge{background:#050914d9;border:1px solid #34436d;border-radius:9px;padding:7px 10px;text-shadow:0 2px 4px #000}.bar{position:absolute;z-index:3;top:45px;left:18%;right:18%;height:18px;border:2px solid #4a5679;border-radius:20px;background:#070b17;overflow:hidden;box-shadow:0 0 20px #000}.bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff315f,#ff9f43);transition:width .08s}.barText{position:absolute;z-index:4;top:45px;left:0;right:0;text-align:center;font-size:12px;font-weight:900;line-height:18px;text-shadow:0 2px 4px #000}.end{position:absolute;z-index:6;inset:0;display:flex;align-items:center;justify-content:center;background:#02040dcc}.endBox{padding:25px;border:1px solid #364572;border-radius:16px;background:#0a1024;text-align:center}.endBox h2{margin:0 0 12px}.endBox button{width:100%}#touch{position:absolute;z-index:5;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.stick{width:130px;height:130px;border-radius:50%;background:#101a36aa;border:1px solid #40507d;pointer-events:auto;position:relative}.knob{position:absolute;width:54px;height:54px;left:38px;top:38px;border-radius:50%;background:#8bb7ffbb}.fire{width:100px;height:100px;border-radius:50%;background:#b92f5bdd;border:2px solid #ff9ab2;pointer-events:auto}.small{font-size:12px;color:#8998bd}@media(max-width:600px){header{height:50px;padding:5px 8px}.title{font-size:14px}.panel{padding:17px}.stick{width:112px;height:112px}.knob{width:48px;height:48px;left:31px;top:31px}.fire{width:88px;height:88px}.bar{left:8%;right:8%}}
</style></head><body><div id="app"><header><strong class="title">BOSS • CO-OP ×4</strong><span id="status" class="bad">Отключено</span></header>
<section id="menu"><div class="panel"><h1>NEBULA RAID</h1><p>Комната до 4 пилотов. Сначала собираемся в лобби, затем хост запускает бой.</p><input id="name" maxlength="16" placeholder="Имя пилота"><div class="row"><button id="create" class="primary">Создать комнату</button></div><div class="row"><input id="code" maxlength="6" placeholder="Код комнаты"><button id="join">Войти</button></div><div id="message" class="hint">Создай комнату или введи код друга.</div><div id="room" class="room hidden"><div class="lobbyTitle"><strong>ЛОББИ</strong><span id="count">0/4</span></div><div class="small">КОД КОМНАТЫ</div><div id="roomCodeBig" class="code">------</div><button id="copy" class="copy">Скопировать код</button><h3>Игроки</h3><div id="playerList" class="players"></div><button id="start" class="start primary hidden">НАЧАТЬ ИГРУ</button></div></div></section>
<main id="game" class="hidden"><div id="hud"><span class="badge" id="players">Игроки: 0/4</span><span class="badge" id="score">Счёт: 0</span><span class="badge" id="roomCode"></span></div><div class="bar"><i id="bossBar"></i></div><div class="barText" id="bossText">БОСС 300 / 300</div><canvas id="canvas"></canvas><div id="touch"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><button class="fire" id="fire">ОГОНЬ</button></div><div id="end" class="end hidden"><div class="endBox"><h2 id="endTitle">БОЙ ОКОНЧЕН</h2><button id="restart" class="primary">ИГРАТЬ СНОВА</button></div></div></main></div>
<script>
const $=s=>document.querySelector(s),menu=$('#menu'),game=$('#game'),canvas=$('#canvas'),ctx=canvas.getContext('2d'),statusEl=$('#status'),message=$('#message'),room=$('#room'),roomCodeBig=$('#roomCodeBig'),roomCodeHud=$('#roomCode'),playerList=$('#playerList'),playersEl=$('#players'),countEl=$('#count'),bossBar=$('#bossBar'),bossText=$('#bossText'),scoreEl=$('#score'),startBtn=$('#start'),end=$('#end'),endTitle=$('#endTitle');
let ws=null,me=null,isHost=false,pendingAction=null,world={width:1600,height:900},state={players:[],bullets:[],boss:{x:800,y:220,hp:300,maxHp:300,modules:[]},phase:'waiting'},input={x:0,y:0};
function serverUrl(){return(location.protocol==='https:'?'wss://':'ws://')+location.host}function setStatus(t,g){statusEl.textContent=t;statusEl.className=g?'ok':'bad'}function send(d){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(d))}
function connect(action){if(ws&&(ws.readyState===WebSocket.OPEN||ws.readyState===WebSocket.CONNECTING)){pendingAction=action;return}pendingAction=action;setStatus('Подключение…',false);ws=new WebSocket(serverUrl());ws.onopen=()=>{setStatus('Подключено',true);if(pendingAction){const a=pendingAction;pendingAction=null;send(a)}};ws.onerror=()=>{setStatus('Ошибка соединения',false);message.textContent='Не удалось связаться с сервером.'};ws.onclose=()=>setStatus('Отключено',false);ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='hello')world=m.world||world;if(m.type==='joined'){me=m.playerId;isHost=!!m.host;showLobby(m.code,m.players||[]);message.textContent='Ждём игроков. Только хост может начать игру.'}if(m.type==='room'){roomCodeBig.textContent=m.code;roomCodeHud.textContent='Комната '+m.code;countEl.textContent=m.count+'/'+m.max;renderRoomPlayers(m.players||[]);isHost=(m.players||[])[0]?.id===me;startBtn.classList.toggle('hidden',!isHost||m.phase!=='waiting');if(m.phase==='waiting')showLobby(m.code,m.players||[])}if(m.type==='state'){state=m;renderRoomPlayers(m.players||[]);playersEl.textContent='Игроки: '+m.players.length+'/4';const meState=m.players.find(p=>p.id===me);scoreEl.textContent='Счёт: '+(meState?.score||0);bossText.textContent='БОСС '+m.boss.hp+' / '+m.boss.maxHp;bossBar.style.width=(Math.max(0,m.boss.hp)/m.boss.maxHp*100)+'%';if(m.phase==='playing'){menu.classList.add('hidden');game.classList.remove('hidden');end.classList.add('hidden')}if(m.phase==='won'||m.phase==='lost'){end.classList.remove('hidden');endTitle.textContent=m.phase==='won'?'БОСС УНИЧТОЖЕН!':'КОМАНДА ПАЛА'}}if(m.type==='error'){message.textContent=m.message;setStatus('Подключено',true)}}}
function showLobby(c,list){room.classList.remove('hidden');roomCodeBig.textContent=c;menu.classList.remove('hidden');game.classList.add('hidden');startBtn.classList.toggle('hidden',!isHost);renderRoomPlayers(list)}
function renderRoomPlayers(list){playerList.innerHTML='';if(!list.length){playerList.innerHTML='<div class="empty">Ожидание игроков…</div>';return}list.forEach((p,i)=>{const d=document.createElement('div');d.className='player';d.innerHTML='<span>'+escapeHtml(p.name)+(p.host?' <span class="host">★ ХОСТ</span>':'')+'</span><span>'+(p.id===me?'Вы':'Пилот '+(i+1))+'</span>';playerList.appendChild(d)})}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('#create').onclick=()=>{const name=$('#name').value.trim()||'Pilot';connect({type:'create',name})};$('#join').onclick=()=>{const c=$('#code').value.trim().toUpperCase();if(c.length!==6){message.textContent='Код должен содержать 6 символов.';return}connect({type:'join',code:c,name:$('#name').value.trim()||'Pilot'})};startBtn.onclick=()=>send({type:'start'});$('#restart').onclick=()=>send({type:'restart'});$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(roomCodeBig.textContent);message.textContent='Код скопирован.'}catch{message.textContent='Код: '+roomCodeBig.textContent}};
setInterval(()=>send({type:'input',x:input.x,y:input.y}),33);$('#fire').addEventListener('pointerdown',e=>{e.preventDefault();send({type:'fire'})});
let active=false;const stick=$('#stick'),knob=$('#knob');function move(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),max=r.width*.34;if(l>max){dx=dx/l*max;dy=dy/l*max}input.x=dx/max;input.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId);move(e)});stick.addEventListener('pointermove',e=>{if(active)move(e)});['pointerup','pointercancel'].forEach(t=>stick.addEventListener(t,()=>{active=false;input.x=input.y=0;knob.style.transform='translate(0,0)'}));
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')send({type:'fire'})});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);setInterval(()=>{if(document.activeElement&&document.activeElement.tagName==='INPUT')return;let x=(keys.d?1:0)-(keys.a?1:0),y=(keys.s?1:0)-(keys.w?1:0);if(x||y){const l=Math.hypot(x,y);input.x=x/l;input.y=y/l}else if(!active){input.x=input.y=0}},33);
function resize(){canvas.width=Math.max(1,canvas.clientWidth*devicePixelRatio);canvas.height=Math.max(1,canvas.clientHeight*devicePixelRatio)}addEventListener('resize',resize);resize();
function draw(){ctx.setTransform(canvas.width/world.width,0,0,canvas.height/world.height,0,0);ctx.fillStyle='#02040b';ctx.fillRect(0,0,world.width,world.height);const t=performance.now();for(let i=0;i<130;i++){ctx.fillStyle=i%5===0?'#9fc5ff66':'#ffffff33';ctx.fillRect((i*197)%world.width,(i*83)%world.height,2+(i%3),2+(i%2))}ctx.strokeStyle='#15264b';ctx.lineWidth=3;for(let x=0;x<world.width;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.height);ctx.stroke()}for(let y=0;y<world.height;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.width,y);ctx.stroke()}
const b=state.boss;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(state.phase==='playing'?t/2500:0);ctx.shadowBlur=30;ctx.shadowColor='#8b5cf6';ctx.fillStyle='#17162e';ctx.strokeStyle='#a78bfa';ctx.lineWidth=8;ctx.beginPath();for(let i=0;i<12;i++){const a=i*Math.PI/6,r=i%2?150:112;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;for(let i=0;i<6;i++){const a=i*Math.PI/3;const alive=(b.modules?.[i]??80)>0;ctx.save();ctx.translate(Math.cos(a)*102,Math.sin(a)*102);ctx.rotate(a);ctx.fillStyle=alive?'#f59e0b':'#25283a';ctx.strokeStyle=alive?'#ffe08a':'#45495e';ctx.lineWidth=4;ctx.fillRect(-23,-23,46,46);ctx.strokeRect(-23,-23,46,46);ctx.restore()}ctx.fillStyle='#ef3158';ctx.beginPath();ctx.arc(0,0,42+Math.sin(t/180)*3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffb0c0';ctx.lineWidth=4;ctx.stroke();ctx.restore();
for(const bullet of state.bullets){ctx.fillStyle=bullet.enemy?'#ff466d':'#7de3ff';ctx.shadowBlur=bullet.enemy?14:8;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(bullet.x,bullet.y,bullet.enemy?9:7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}for(const p of state.players){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(state.boss.y-p.y,state.boss.x-p.x)+Math.PI/2);ctx.shadowBlur=18;ctx.shadowColor=p.color;ctx.fillStyle=p.color;ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(22,25);ctx.lineTo(0,16);ctx.lineTo(-22,25);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#dff8ff';ctx.fillRect(-5,-10,10,18);ctx.restore();ctx.fillStyle='#fff';ctx.font='18px system-ui';ctx.textAlign='center';ctx.fillText(p.name,p.x,p.y-38);ctx.fillStyle='#111';ctx.fillRect(p.x-30,p.y+32,60,6);ctx.fillStyle='#4ade80';ctx.fillRect(p.x-30,p.y+32,60*Math.max(0,p.hp)/100,6)}requestAnimationFrame(draw)}draw();
</script></body></html>
