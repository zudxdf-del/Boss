<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Nebulock</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040a;color:#fff;font-family:system-ui,sans-serif}body{touch-action:manipulation}button,input{font:inherit}button{border:0;border-radius:12px;padding:13px 16px;background:#26345e;color:#fff;font-weight:800;min-height:52px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.97)}button.primary{background:#7048e8}button:disabled{opacity:.45}input{width:100%;min-height:52px;padding:12px;border:1px solid #34456f;border-radius:12px;background:#0b1124;color:#fff;font-size:16px}.top{height:56px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:#070b17;border-bottom:1px solid #202d4b}.status{font-size:13px;color:#ff6f91}.connected{color:#55e58b}.screen{position:absolute;inset:56px 0 0}.menu{display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 20%,#192653,#03040a 70%)}.card{width:min(440px,94vw);padding:22px;border:1px solid #304268;border-radius:20px;background:#090f21ef;box-shadow:0 20px 70px #0008}.card h1{margin:0;font-size:38px;letter-spacing:2px}.sub{color:#aab8d7;margin:5px 0 20px}.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}.msg{min-height:24px;margin-top:12px;color:#9eafd1;font-size:14px}.lobby{margin-top:16px;padding:15px;border:1px solid #2c3c64;border-radius:15px;background:#050a17}.code{font-size:32px;text-align:center;font-weight:950;letter-spacing:8px;margin:6px 0 12px}.players{display:grid;gap:7px}.player{display:flex;justify-content:space-between;padding:10px;border-radius:9px;background:#101a33}.host{color:#ffd166}.game{background:#02030a}.canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap;pointer-events:none}.badge{padding:7px 10px;border:1px solid #34466e;border-radius:10px;background:#050a16dd;font-size:12px;font-weight:800}.touch{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.stick{width:124px;height:124px;border:2px solid #40547f;border-radius:50%;background:#121d3ccc;pointer-events:auto;position:relative;touch-action:none}.knob{position:absolute;width:50px;height:50px;left:35px;top:35px;border-radius:50%;background:#8bb7ffcc}.fire{width:94px;height:94px;border-radius:50%;background:#b83261;border:2px solid #ff9db9;pointer-events:auto;touch-action:none}.hidden{display:none!important}.help{font-size:13px;color:#8798bd;margin-top:14px;line-height:1.5}.hostReady{border-color:#55e58b}.startText{display:block;margin-top:7px;color:#55e58b;font-size:13px}
</style>
</head>
<body>
<header class="top"><strong>NEBULOCK</strong><span id="status" class="status">Подключение…</span></header>
<section id="menu" class="screen menu"><div class="card"><h1>NEBULOCK</h1><div class="sub">Космическая командная битва • до 4 игроков</div><input id="name" maxlength="16" placeholder="Имя игрока" autocomplete="nickname"><div class="row"><button type="button" id="create" class="primary">Создать комнату</button></div><div class="row"><input id="code" maxlength="6" placeholder="Код комнаты" inputmode="text"><button type="button" id="join">Войти</button></div><div id="msg" class="msg">Соединение с сервером устанавливается автоматически.</div><div id="lobby" class="lobby hidden"><b>ЛОББИ</b><div id="bigCode" class="code">------</div><div id="players" class="players"></div><span id="startText" class="startText"></span><button type="button" id="start" class="primary" style="width:100%;margin-top:12px">НАЧАТЬ ИГРУ</button></div></div></section>
<section id="game" class="screen game hidden"><canvas id="canvas" class="canvas"></canvas><div class="hud"><span id="count" class="badge">Игроки: 0/4</span><span id="roomHud" class="badge">Комната ------</span><span id="hp" class="badge">HP: 100</span></div><div class="touch"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><button type="button" id="fire" class="fire">ОГОНЬ</button></div></section>
<script>
'use strict';
const $=id=>document.getElementById(id);
const menu=$('menu'),game=$('game'),status=$('status'),msg=$('msg'),lobby=$('lobby'),bigCode=$('bigCode'),playersEl=$('players'),start=$('start'),startText=$('startText'),canvas=$('canvas'),ctx=canvas.getContext('2d'),count=$('count'),roomHud=$('roomHud'),hp=$('hp'),stick=$('stick'),knob=$('knob');
let ws=null,me=null,roomCode='',phase='lobby',players=[],shots=[],stars=[],input={x:0,y:0},drag=false,reconnectTimer=null;
function setStatus(t,ok){status.textContent=t;status.className=ok?'status connected':'status'}
function send(data){if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify(data));return true}msg.textContent='Нет соединения с сервером. Подключаемся…';connect();return false}
function connect(){if(ws&&(ws.readyState===WebSocket.OPEN||ws.readyState===WebSocket.CONNECTING))return;setStatus('Подключение…',false);const proto=location.protocol==='https:'?'wss':'ws';try{ws=new WebSocket(proto+'://'+location.host)}catch(e){setStatus('Ошибка соединения',false);msg.textContent='WebSocket недоступен.';return}ws.onopen=()=>{setStatus('Подключено',true);msg.textContent='Сервер готов. Можно создать комнату или войти по коду.'};ws.onmessage=e=>{try{handle(JSON.parse(e.data))}catch(err){console.error(err);msg.textContent='Ошибка данных сервера.'}};ws.onerror=()=>{setStatus('Ошибка соединения',false)};ws.onclose=()=>{setStatus('Отключено',false);if(reconnectTimer)clearTimeout(reconnectTimer);reconnectTimer=setTimeout(connect,1000)}}
function handle(m){if(m.type==='hello')return;if(m.type==='joined'){me=m.playerId;roomCode=m.code;showLobby(m);return}if(m.type==='room'){roomCode=m.code;updateLobby(m);if(m.phase==='playing'){phase='playing';showGame()}return}if(m.type==='state'){phase=m.phase;players=m.players||[];shots=m.shots||[];stars=m.stars||stars;updateGame();if(m.phase==='finished')msg.textContent='Игра окончена.';return}if(m.type==='error'){msg.textContent=m.message;return}}
function showLobby(m){menu.classList.remove('hidden');game.classList.add('hidden');lobby.classList.remove('hidden');updateLobby(m)}
function updateLobby(m){bigCode.textContent=m.code;count.textContent='Игроки: '+m.count+'/'+m.max;roomCode=m.code;playersEl.innerHTML='';let isHost=false;(m.players||[]).forEach(p=>{const d=document.createElement('div');d.className='player';const left=document.createElement('span');left.textContent=p.name;const right=document.createElement('span');right.textContent=p.host?'★ ХОСТ':p.id===me?'ВЫ':'ПИЛОТ';if(p.host)right.className='host';if(p.id===me&&p.host)isHost=true;d.append(left,right);playersEl.appendChild(d)});start.classList.toggle('hidden',!isHost);start.disabled=!isHost;startText.textContent=isHost?'Вы хост — игра начнётся по вашей кнопке.':'Хост управляет запуском игры.';msg.textContent=isHost?'Вы хост. Нажмите «НАЧАТЬ ИГРУ».':'Ожидание хоста…'}
function showGame(){menu.classList.add('hidden');game.classList.remove('hidden');resize()}
function updateGame(){count.textContent='Игроки: '+players.length+'/4';const p=players.find(x=>x.id===me);hp.textContent='HP: '+(p?p.hp:100);roomHud.textContent='Комната '+roomCode;if(phase==='playing')showGame()}
function createRoom(){const name=$('name').value.trim()||'Pilot';send({type:'create',name})}
function joinRoom(){const c=$('code').value.trim().toUpperCase();if(c.length!==6){msg.textContent='Введите 6-значный код.';return}const name=$('name').value.trim()||'Pilot';send({type:'join',code:c,name})}
$('create').addEventListener('click',createRoom);$('join').addEventListener('click',joinRoom);start.addEventListener('click',()=>{if(me&&start.classList.contains('hidden')===false)send({type:'start'})});
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')createRoom()});$('code').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom()});$('fire').addEventListener('pointerdown',e=>{e.preventDefault();send({type:'fire'})});
function move(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.34;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy)||1;if(l>max){dx=dx/l*max;dy=dy/l*max}input.x=dx/max;input.y=dy/max;knob.style.transform='translate('+dx+'px,'+dy+'px)'}
stick.addEventListener('pointerdown',e=>{e.preventDefault();drag=true;stick.setPointerCapture(e.pointerId);move(e)});stick.addEventListener('pointermove',e=>{if(drag){e.preventDefault();move(e)}});['pointerup','pointercancel','lostpointercapture'].forEach(t=>stick.addEventListener(t,()=>{drag=false;input.x=input.y=0;knob.style.transform='translate(0,0)'}));
setInterval(()=>{if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'input',x:input.x,y:input.y}))},33);setInterval(()=>{if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'ping',t:Date.now()}))},5000);
function resize(){const d=Math.max(1,devicePixelRatio||1);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor((innerHeight-56)*d)}addEventListener('resize',resize);resize();
function draw(){const sx=canvas.width/1200,sy=canvas.height/800;ctx.setTransform(sx,0,0,sy,0,0);ctx.fillStyle='#03040a';ctx.fillRect(0,0,1200,800);for(const s of stars){ctx.fillStyle='#ffffff55';ctx.fillRect(s.x,s.y,s.s,s.s)}for(const s of shots){ctx.fillStyle='#ff668c';ctx.beginPath();ctx.arc(s.x,s.y,5,0,Math.PI*2);ctx.fill()}for(const p of players){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=p.id===me?'#63d8ff':'#b58cff';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(15,15);ctx.lineTo(0,9);ctx.lineTo(-15,15);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#111827';ctx.fillRect(-22,-34,44,5);ctx.fillStyle='#55e58b';ctx.fillRect(-22,-34,44*Math.max(0,p.hp)/100,5);ctx.restore()}requestAnimationFrame(draw)}requestAnimationFrame(draw);connect();
</script>
</body>
</html>
