<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Boss — 4 Player Co-op</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050816;color:#eef6ff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}#app{height:100dvh;display:flex;flex-direction:column}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#0b1024;border-bottom:1px solid #20294a}button,input{font:inherit}button{min-height:44px;border:0;border-radius:10px;padding:8px 14px;background:#26345d;color:#fff;font-weight:700}button:active{transform:scale(.97)}input{min-height:44px;border-radius:10px;border:1px solid #334269;background:#0c132a;color:#fff;padding:8px 12px;width:150px}#menu{position:absolute;z-index:5;inset:58px 0 0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#172553,#050816 65%)}.panel{width:min(420px,92vw);padding:24px;border:1px solid #29365d;border-radius:18px;background:#0b1126;box-shadow:0 20px 60px #0008}.panel h1{margin:0 0 8px}.panel p{color:#aab7d7}.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.hint{font-size:13px;color:#8998bd}.hidden{display:none!important}#game{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;font-weight:700;text-shadow:0 2px 4px #000}.badge{background:#0a1022cc;border:1px solid #29365d;border-radius:10px;padding:7px 10px}#touch{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.stick{width:130px;height:130px;border-radius:50%;background:#111b39aa;border:1px solid #40507d;pointer-events:auto;position:relative}.knob{position:absolute;width:54px;height:54px;left:38px;top:38px;border-radius:50%;background:#8bb7ffbb}.fire{width:100px;height:100px;border-radius:50%;background:#c33b62dd;border:2px solid #ff9ab2;pointer-events:auto}.fire span{font-size:18px}.small{font-size:12px;color:#aab7d7}
@media(max-width:600px){header{height:52px;padding:5px 8px}header .title{font-size:14px}.panel{padding:18px}.stick{width:112px;height:112px}.knob{width:48px;height:48px;left:31px;top:31px}.fire{width:88px;height:88px}}
</style></head>
<body><div id="app"><header><strong class="title">BOSS • CO-OP ×4</strong><span id="status">Отключено</span></header><section id="menu"><div class="panel"><h1>NEBULA RAID</h1><p>Оригинальный кооперативный bullet-hell: до 4 пилотов против модульного босса.</p><input id="name" maxlength="16" placeholder="Имя пилота"><div class="row"><button id="create">Создать комнату</button></div><div class="row"><input id="code" maxlength="6" placeholder="Код комнаты"><button id="join">Войти</button></div><div id="roomInfo" class="hint">Создай комнату или введи код друга.</div></div></section><main id="game" class="hidden"><div id="hud"><span class="badge" id="players">Игроки: 0/4</span><span class="badge" id="bossHp">БОСС: 300/300</span><span class="badge" id="roomCode"></span></div><canvas id="canvas"></canvas><div id="touch"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><button class="fire" id="fire"><span>ОГОНЬ</span></button></div></main></div>
<script>
const menu=document.querySelector('#menu'),game=document.querySelector('#game'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');
const statusEl=document.querySelector('#status'),playersEl=document.querySelector('#players'),bossHpEl=document.querySelector('#bossHp'),roomCodeEl=document.querySelector('#roomCode'),roomInfo=document.querySelector('#roomInfo');
let ws,me=null,world={width:1600,height:900},state={players:[],bullets:[],boss:{x:800,y:180,hp:300,maxHp:300},phase:'waiting'},input={x:0,y:0};
function serverUrl(){const p=location.protocol==='https:'?'wss:':'ws:';return p+'//'+location.host}
function connect(){ws=new WebSocket(serverUrl());ws.onopen=()=>statusEl.textContent='Подключено';ws.onclose=()=>{statusEl.textContent='Нет соединения'};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='hello'){world=m.world}if(m.type==='joined'){me=m.playerId;roomCodeEl.textContent='Комната '+m.code;menu.classList.add('hidden');game.classList.remove('hidden');roomInfo.textContent='Код: '+m.code}if(m.type==='room'){playersEl.textContent='Игроки: '+m.count+'/'+m.max;if(m.code)roomCodeEl.textContent='Комната '+m.code}if(m.type==='state'){state=m;bossHpEl.textContent='БОСС: '+m.boss.hp+'/'+m.boss.maxHp}if(m.type==='error')roomInfo.textContent=m.message}}
function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}
function join(create){connect();setTimeout(()=>send(create?{type:'create',name:document.querySelector('#name').value}:{type:'join',code:document.querySelector('#code').value.trim().toUpperCase(),name:document.querySelector('#name').value}),200)}
document.querySelector('#create').onclick=()=>join(true);document.querySelector('#join').onclick=()=>join(false);
setInterval(()=>send({type:'input',x:input.x,y:input.y}),33);document.querySelector('#fire').addEventListener('pointerdown',e=>{e.preventDefault();send({type:'fire'})});
let active=false;const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');function move(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),max=r.width*.34;if(l>max){dx=dx/l*max;dy=dy/l*max}input.x=dx/max;input.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId);move(e)});stick.addEventListener('pointermove',e=>{if(active)move(e)});stick.addEventListener('pointerup',()=>{active=false;input.x=input.y=0;knob.style.transform='translate(0,0)'});stick.addEventListener('pointercancel',()=>{active=false;input.x=input.y=0;knob.style.transform='translate(0,0)'});
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')send({type:'fire'})});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);setInterval(()=>{if(document.activeElement.tagName==='INPUT')return;let x=(keys.d?1:0)-(keys.a?1:0),y=(keys.s?1:0)-(keys.w?1:0);if(x||y){const l=Math.hypot(x,y);input.x=x/l;input.y=y/l}else if(!active){input.x=input.y=0}},33);
function resize(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio}addEventListener('resize',resize);resize();
function draw(){ctx.setTransform(canvas.width/world.width,0,0,canvas.height/world.height,0,0);ctx.clearRect(0,0,world.width,world.height);ctx.fillStyle='#050816';ctx.fillRect(0,0,world.width,world.height);for(let i=0;i<90;i++){const x=(i*197)%world.width,y=(i*83)%world.height;ctx.fillStyle='#ffffff44';ctx.fillRect(x,y,2,2)}
const b=state.boss;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(state.phase==='playing'?performance.now()/2500:0);ctx.fillStyle='#4b235f';ctx.strokeStyle='#c77dff';ctx.lineWidth=8;ctx.beginPath();for(let i=0;i<12;i++){const a=i*Math.PI/6,r=i%2?125:100;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.fillStyle=b.modules?.[i]>0?'#f59e0b':'#333';ctx.fillRect(Math.cos(a)*78-16,Math.sin(a)*78-16,32,32)}ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(0,0,34,0,Math.PI*2);ctx.fill();ctx.restore();
for(const bullet of state.bullets){ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(bullet.x,bullet.y,7,0,Math.PI*2);ctx.fill()}
for(const p of state.players){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=p.color;ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(19,22);ctx.lineTo(0,14);ctx.lineTo(-19,22);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.font='18px system-ui';ctx.textAlign='center';ctx.fillText(p.name,0,-34);ctx.fillStyle='#222';ctx.fillRect(-25,30,50,6);ctx.fillStyle='#4ade80';ctx.fillRect(-25,30,50*Math.max(0,p.hp)/100,6);ctx.restore()}
requestAnimationFrame(draw)}draw();
</script></body></html>
